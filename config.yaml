# 模型选择
# 默认走路由函数；route 暂时留空时，使用下面的 model / vlm_model
route: ""

# 生图模型（route 为空时生效）
# 可选：wan2.7-image / wan2.7-image-pro / doubao-seedream-5.0-lite / doubao-seedream-5.0-pro
model: "wan2.7-image"

# VLM 模型（route 为空时生效）
# 可选：qwen3.8-flash / qwen3.8-max / doubao-seed-2.1-pro
vlm_model: "qwen3.8-flash"

# 图像参数
size: "2K"
output_format: "png"
watermark: false
max_images: 1

# 融合参数
# object_resize_scale 是缺省值；有类别配置时以 object_resize_scales 为准
# 数值 = 可见最长边 / 画面宽度。按约 2.4 m 宽的废钢车斗实拍推算真实物体长度
object_resize_scale: 0.022
object_resize_scales:
  # 小件包装、滤杯、座体
  密封胶罐: [0.016, 0.024]    # 广口瓶高约 8–11 cm
  集油器: [0.018, 0.028]      # 油水分离杯总高约 16 cm
  轴承座: [0.020, 0.032]      # UCP210 座长约 21 cm
  自喷漆罐: [0.018, 0.028]    # 400 ml 罐高约 21–23 cm
  杀虫剂罐: [0.022, 0.034]    # 600 ml 气雾罐高约 28–32 cm
  # 中件工具、减震、灭火器
  减震器: [0.020, 0.038]      # 气压约 15–19 cm；液压减震更长
  千斤顶: [0.028, 0.042]      # 10 t 瓶式最低约 23 cm，升起约 46 cm
  气缸: [0.025, 0.040]        # ISO 拉杆缸含行程常见 30–50 cm
  灭火器: [0.032, 0.048]      # 6 kg 手提式总高约 50–55 cm
  # 较大液压件与罐体（整件超过 0.8 m 时按埋入后仍可辨认的一段）
  分离过滤器: [0.035, 0.052]  # 旋风罐总高约 0.5–0.8 m
  油缸: [0.042, 0.062]        # 重型耳环油缸含杆常超过 1 m
  液压缸: [0.040, 0.058]      # 耳环液压缸行程常见 0.1–0.8 m
  球阀: [0.045, 0.070]        # DN350 阀体/法兰可见段约 0.4–0.7 m
  气瓶: [0.050, 0.075]        # 中型钢瓶可见段约 0.5–0.8 m（整瓶 0.8–1.5 m）
  储罐: [0.055, 0.080]        # 小型立式罐可见段约 0.6–0.9 m（整罐可达 2 m+）
object_canvas_scale: 1.0
object_opacity: 0.5
object_anchor: "center"

# VLM优化配置
enable_vlm_optimization: true
max_optimization_rounds: 3
size_tolerance: "very_small"

# 目录配置
backgrounds_dir: "input/backgrounds"
objects_dir: "input/objects"
prompt_templates_path: "prompts/prompt_templates.json"
negative_prompt_path: "prompts/negative_prompt.txt"
output_images_dir: "output/images"
output_final_images_dir: "output/final_images"
output_metadata_dir: "output/metadata"
output_failed_dir: "output/failed"
output_bbox_dir: "output/bbox"
output_analysis_dir: "output/analysis"

# 其他配置
timeout_seconds: 300
sleep_seconds: 1.0
total_num: 100
seed: null