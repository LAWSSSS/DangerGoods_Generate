[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "controlled-scene-fusion"
version = "0.8.1"
description = "Evidence-aware multi-object scene fusion following the Chinese implementation manual"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32.3", "PyYAML>=6.0.2", "Pillow>=10.4.0,<13",
  "numpy>=1.24,<3", "jsonschema>=4.18,<5", "httpx>=0.28,<1",
  "opencv-python-headless>=4.8,<5",
]

[project.scripts]
scene-fusion = "fusion_engine.controlled.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fusion_engine = ["schemas/*.json", "templates/*.yaml"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
