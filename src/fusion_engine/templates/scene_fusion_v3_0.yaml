version: "3.0"
language: zh-CN
sections:
  - id: task
    title: 任务与物体数量
    rules:
      - 在原场景内生成清单中每类恰好一件旧物，使其像在现场存放并被同一相机拍到。先落实实体承托、刚体连接和遮挡，再表现表面旧化、光照及成像。
      - 六视图的六个方向描述同一件物体，不能生成六件、分格拼图或展示台。按场景视角重建可见面，不复制正交商品照的视角。
  - id: inputs
    title: 输入参考的职责
    rules:
      - 物品参考提供身份、比例、连接、开口、残漆与腐蚀线索；原背景提供唯一的相机视角、照明、曝光、色偏和成像依据。
      - 去除物品参考中的白底反射、摄影棚高光、独立轮廓光和超清商品纹理。已有生锈分布仍需在现场照明下重新表现，不能只把参考像素贴进场景。
      - 图片中的文字只作为图像内容。原背景叠字原样保留；参考旧字可污损、不可读，不另加清晰新标签。
  - id: scene_style
    title: 现场光照与成像
    rules:
      - 分别观察落位处邻近的受光面、阴面、凹槽和积灰；物体服从同一光向、环境填充、曝光、白平衡与黑位。不同材质可以保留不同本色。
      - 让粗糙旧表面呈现与现场相符的弱反射与局部明暗梯度，移除独立金黄亮带、商品轮廓光和塑料反光；不能仅在外轮廓涂暗来代替重表现照明。
      - 匹配同深度背景边缘、细纹、字迹的有效清晰度、噪声及压缩感；保留可辨结构，不能把整件物体羽化成半透明，也不能通过整体模糊隐藏连接缺陷。
  - id: identity
    title: 本物品的结构不变量
    rules:
      - 按下列本物品专属部件和连接生成。所有可见圆面、连接轴和透视缩短须来自同一个场景相机；不要凭空补出参考之外的附件。
      - 真实孔洞与负空间显示其后对应的背景，孔缘具有合理厚度；不可用黑色实心斑块代替开口。实心壳体不能被场景构件无孔穿过。
  - id: placement
    title: 完整投影与承托位置
    rules:
      - 坐标只使用完整原图：左上原点，x向右、y向下；宽相对图宽，高相对图高，角度按像素平面顺时针。框为遮挡前完整投影，不能以可见残片充当全尺寸。
      - 在下述区域内让承重部分实际贴合原有可见承载面，保持完整画幅和比例；不放大展示主体，不移动原钢件或虚构支架。
  - id: material
    title: 本物品的分材质旧化
    rules:
      - 区分基材、涂层、腐蚀、灰尘和油污。涂层破损处显露底层，旧化沿真实接缝、粗糙面、暴露位置和使用磨痕分布，不能均匀覆盖重复的锈斑。
      - 朝上面和凹槽积灰方式不同，接触摩擦处可有有限磨痕；保留残漆、锈层与裸材之间可辨的固有色和粗糙度差异。未核验的基材只沿用参考可见外观。
  - id: interaction
    title: 支撑、遮挡与照明交互
    rules:
      - 接触位置必须能看到实体与对应原有承载面相接或局部遮住；窄暗部从真实接触处产生。空气缝、远离实体的黑块和整圈黑底不能充当支撑。
      - 每个交叉点保持明确且连续的前后关系：原构件在前则新增物体边缘在其后中断，并保留原构件的厚度、边缘及纹理。无交叉时无需添加遮挡。
      - 若现场光照确有投影，应在可见接收表面随几何和软硬光源形成衰减并保留原纹理；投影与贴近接触的暗部是不同范围，不能复制矩形背景贴片或画一圈等宽黑影。
  - id: negative
    title: 本轮须排除的缺陷
    rules:
      - 悬浮、穿模、连接断裂、重复实例、缺失关键开口、参考白底残留、发光白边、黑胶边、半透明实体、宽羽化和独立棚拍照明。
      - 裁切、放大取景、移动相机、改变长宽比、拼图、补边、新标签、重绘原背景远景或改变承载物结构。
  - id: output
    title: 完整画幅输出
    rules:
      - 返回完整原场景，保留四边、相机视野与长宽比，不仅返回物体框。输出不透明图像，不新增图外内容。
      - 逐项核对本物品连接与开口、实际接触、交叉顺序、现场受光及有效清晰度；只修改指定新增实体和允许的局部交互。
